<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip & Bill Splitter</title>
  <link rel="stylesheet" href="/home/ngure/Documents/certificate/styles.css">
</head>
<body>
  <div class="card">
    <h1>Tip & Bill Splitter</h1>

    <label for="bill">Bill amount</label>
    <input type="number" id="bill" placeholder="e.g. 2500">

    <label for="tip">Tip (%)</label>
    <input type="number" id="tip" placeholder="e.g. 10">

    <label for="people">Number of people</label>
    <input type="number" id="people" placeholder="e.g. 4">

    <button id="calculate">Calculate</button>

    <div id="result"></div>
  </div>

  <script src="/home/ngure/Documents/certificate/script.js"></script>
</body>
</html>
